# Builds the app and runs its unit tests at every push and pull request; also checks that the
# timetable tool still turns the GTFS fixture into a pack the app reads.
name: android

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "README.md", "CHANGELOG.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack from the GTFS fixture
        run: |
          python3 tools/make-transit.py app/src/test/resources/gtfs out
          cmp out/switzerland.transit app/src/test/resources/test.transit && echo "fixture pack unchanged" || echo "fixture pack differs from the committed one (fine if the tool changed on purpose)"
      - name: Unit tests
        run: ./gradlew --no-daemon -q :app:testDebugUnitTest
      - name: Debug build
        run: ./gradlew --no-daemon -q :app:assembleDebug
